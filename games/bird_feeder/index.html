<!-- Файл: index.html | Игра: Покорми Птиц! | Версия: 1.0.19 -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com; img-src 'self' data: blob: https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Покорми Птиц! V1.0.19</title>
    
    <!-- Подключаем скрипт куки и аналитики из корня сайта (2 шага назад) -->
    <script src="../../analytics.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style_v1.0.14.css">
</head>
<body>

    <!--
        Изображения подготавливаются до старта игры, а аудио подгружается
        браузером по мере необходимости, поэтому медленная сеть не блокирует запуск.
    -->

    <div id="app-wrapper">
        
        <div id="game-container">
            <!-- Верхний интерфейс -->
            <div id="ui-top">
                <div class="score-board">
                    <button id="btn-pause" data-action="toggle-pause">⏳ Загрузка...</button>
                    <span id="txt-score-lbl">Счет:</span> <span id="score">0</span> | <span id="txt-record-lbl">Рекорд:</span> <span id="high-score">0</span>
                </div>
                
                <!-- Панель управления звуками и Валютой выстроена справа -->
                <div class="right-controls">
                    <div class="audio-controls">
                        <button class="audio-btn active btn-music-sync" id="txt-music-top" data-action="toggle-audio" data-audio-id="audio-music" data-sync-class="btn-music-sync">🎵 Музыка</button>
                        <button class="audio-btn active btn-nature-sync" id="txt-nature-top" data-action="toggle-audio" data-audio-id="audio-nature" data-sync-class="btn-nature-sync">🌲 Природа</button>
                        <button class="audio-btn active btn-sfx-sync" id="txt-sfx-top" data-action="toggle-sfx">🔊 Звуки</button>
                    </div>
                    <!-- Новый счетчик солнц без рамки, под кнопкой звуки -->
                    <div id="sun-counter" class="sun-counter">☀️ <span id="sun-val">0</span></div>
                </div>
            </div>
            
            <div id="table-zone"></div>

            <!-- ОВЕРЛЕИ МЕНЮ -->
            <!-- 1. Главное меню -->
            <div id="menu-main" class="menu-overlay">
                <h1 class="game-title">Покорми Птиц!</h1>
                
                <button class="menu-btn" id="txt-play-main" data-action="start-game" style="margin-bottom: 20px;">⏳ Загрузка...</button>
                <button class="menu-btn" id="txt-menu-vol" data-action="open-menu" data-menu="menu-settings">⚙ Громкость</button>
                <button class="menu-btn" id="txt-menu-lang" data-action="open-menu" data-menu="menu-language">🌍 Язык: Авто</button>
                <button class="menu-btn" id="txt-menu-ads" data-action="open-menu" data-menu="menu-ads">📺 Реклама: ВЫКЛ</button>
                <button class="menu-btn" id="txt-menu-lore" data-action="open-menu" data-menu="menu-lore">📖 Лор игры</button>
                <button class="menu-btn" id="txt-menu-socials" data-action="open-menu" data-menu="menu-socials">📱 Соцсети разработчика</button>
                <button class="menu-btn" id="txt-menu-bugs" data-action="open-menu" data-menu="menu-bugs">🐛 Сообщить об ошибке</button>
                <button class="menu-btn exit-menu-btn" id="exit-game" type="button">Выйти из игры</button>
                
                <!-- Версия игры -->
                <div class="game-version">V1.0.19</div>
            </div>

            <!-- 2. Выбор языка -->
            <div id="menu-language" class="menu-overlay hidden">
                <h2 class="menu-title" id="txt-title-lang">Язык / Language</h2>
                
                <div class="setting-row" style="justify-content: center; gap: 15px; width: auto; padding: 20px 40px;">
                    <button class="audio-btn active" id="lang-auto" data-action="set-language" data-language="auto" style="font-size: 18px; padding: 10px 25px;">Авто</button>
                    <button class="audio-btn" id="lang-ru" data-action="set-language" data-language="ru" style="font-size: 18px; padding: 10px 25px;">Русский</button>
                    <button class="audio-btn" id="lang-en" data-action="set-language" data-language="en" style="font-size: 18px; padding: 10px 25px;">English</button>
                </div>

                <button class="menu-btn back-btn" data-action="open-menu" data-menu="menu-main">⬅ Назад</button>
            </div>

            <!-- 3. Настройка громкости -->
            <div id="menu-settings" class="menu-overlay hidden">
                <h2 class="menu-title" id="txt-title-settings">Настройка громкости</h2>
                
                <div class="setting-row">
                    <button class="audio-btn active btn-music-sync" id="txt-music-set" data-action="toggle-audio" data-audio-id="audio-music" data-sync-class="btn-music-sync">🎵 Музыка</button>
                    <input id="game-music-volume" type="range" min="0" max="100" value="13" data-volume="audio-music">
                    <output class="volume-percent" for="game-music-volume" data-volume-output="audio-music">13%</output>
                </div>
                
                <div class="setting-row">
                    <button class="audio-btn active btn-nature-sync" id="txt-nature-set" data-action="toggle-audio" data-audio-id="audio-nature" data-sync-class="btn-nature-sync">🌲 Природа</button>
                    <input id="game-nature-volume" type="range" min="0" max="100" value="33" data-volume="audio-nature">
                    <output class="volume-percent" for="game-nature-volume" data-volume-output="audio-nature">33%</output>
                </div>

                <div class="setting-row">
                    <button class="audio-btn active btn-sfx-sync" id="txt-sfx-set" data-action="toggle-sfx">🔊 Звуки</button>
                    <input id="game-sfx-volume" type="range" min="0" max="100" value="55" data-volume="sfx">
                    <output class="volume-percent" for="game-sfx-volume" data-volume-output="sfx">55%</output>
                </div>
                
                <div class="sfx-test-row" style="justify-content: center;">
                    <button class="test-btn" id="txt-test-seeds" data-action="play-sfx" data-sfx="seeds">🌻 Семечки</button>
                    <button class="test-btn" id="txt-test-meat" data-action="play-sfx" data-sfx="meat">🥩 Мясо</button>
                </div>

                <button class="menu-btn back-btn" data-action="open-menu" data-menu="menu-main">⬅ Назад</button>
            </div>

            <!-- 4. Реклама -->
            <div id="menu-ads" class="menu-overlay hidden">
                <h2 class="menu-title" id="txt-title-ads">Настройка рекламы</h2>
                <div class="lore-text" id="txt-desc-ads" style="text-align: center; margin-bottom: 20px;">
                    ...
                </div>
                <button class="menu-btn" id="txt-btn-enable-ads" data-action="toggle-ads" style="background-color: #d35400;">📺 Включить рекламу</button>
                <button class="menu-btn back-btn" data-action="open-menu" data-menu="menu-main">⬅ Назад</button>
            </div>

            <!-- 4.1 Оповещение о рекламе -->
            <div id="menu-ad-alert" class="menu-overlay hidden">
                <h2 class="menu-title" id="txt-title-ad-alert" style="color: #f39c12;">Реклама</h2>
                <div class="lore-text" id="txt-desc-ad-alert" style="text-align: center;">
                    ...
                </div>
                <button class="menu-btn back-btn" data-action="open-menu" data-menu="menu-main">⬅ Назад</button>
            </div>

            <!-- 5. Лор игры -->
            <div id="menu-lore" class="menu-overlay hidden">
                <h2 class="menu-title" id="txt-title-lore">Лор игры</h2>
                <div class="lore-text" id="txt-desc-lore">
                    ...
                </div>
                <button class="menu-btn back-btn" data-action="open-menu" data-menu="menu-main">⬅ Назад</button>
            </div>

            <!-- 6. Ошибки -->
            <div id="menu-bugs" class="menu-overlay hidden">
                <h2 class="menu-title" id="txt-title-bugs">Сообщить об ошибке</h2>
                <div class="lore-text" id="txt-desc-bugs">
                    ...
                </div>
                <button class="menu-btn back-btn" data-action="open-menu" data-menu="menu-main">⬅ Назад</button>
            </div>

            <!-- 7. Соцсети -->
            <div id="menu-socials" class="menu-overlay hidden">
                <h2 class="menu-title" id="txt-title-socials">Соцсети разработчика</h2>
                
                <div class="socials-list" id="socials-container"></div>
                
                <button class="menu-btn back-btn" data-action="open-menu" data-menu="menu-main">⬅ Назад</button>
            </div>
        </div>

        <!-- Нижняя панель -->
        <div id="ui-bottom">
            <button class="food-btn" id="btn-seeds" data-action="add-food" data-food="seeds">🌻 Семечки</button>
            <button class="food-btn" id="btn-meat" data-action="add-food" data-food="meat">🥩 Мясо</button>
            <div id="food-status"><span id="txt-food-lbl">Еда:</span><br><span id="food-count">0</span>/10</div>
        </div>

    </div>

    <!-- Тексты и Локализация -->
    <script src="lang_v1.0.14.js"></script>
    
    <!-- Логика Игры: античит, RAM-кэш, музыка и SFX из оперативной памяти -->
    <script src="game_v1.0.17.js"></script>
    <script type="module" src="game-experience.js"></script>
</body>
</html>
