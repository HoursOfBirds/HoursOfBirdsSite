<!DOCTYPE html> <!-- Указываем браузеру, что это современный HTML5 документ -->
<html lang="ru"> <!-- Открываем тег HTML и задаем базовый язык страницы (русский) -->
<head> <!-- В теге head хранится техническая информация, которую не видно на самой странице -->
    
    <meta charset="UTF-8"> <!-- Устанавливаем кодировку UTF-8, чтобы русские буквы отображались корректно, а не иероглифами -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Настраиваем масштаб для мобильных телефонов, чтобы сайт не выглядел мелким на смартфоне -->
    <title>Hours of Birds - Визитка</title> <!-- Название вкладки, которое будет отображаться в браузере в самом верху -->

    <style> /* Открываем тег style, здесь начинается CSS - дизайн и внешний вид сайта */
        
        /* === БАЗОВЫЕ НАСТРОЙКИ === */
        * { /* Звездочка означает "применить ко всем элементам на сайте" */
            box-sizing: border-box; /* Делает так, чтобы рамки и отступы не увеличивали заданный размер элементов */
            margin: 0; /* Убираем внешние отступы, которые браузер ставит по умолчанию */
            padding: 0; /* Убираем внутренние отступы по умолчанию */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; /* Задаем красивый современный шрифт без засечек */
        }

        body { /* Настройки для всего видимого тела сайта */
            background-color: #121214; /* Задаем темно-серый, почти черный цвет фона (идеально для темной темы) */
            color: #ffffff; /* Делаем весь основной текст белым */
            display: flex; /* Включаем "резиновую" сетку (Flexbox) для удобного выравнивания элементов */
            flex-direction: column; /* Выстраиваем элементы колонкой (сверху вниз) */
            align-items: center; /* Центрируем все элементы по горизонтали */
            min-height: 100vh; /* Заставляем сайт занимать минимум 100% высоты экрана (даже если контента мало) */
            padding: 20px; /* Делаем отступ от краев экрана в 20 пикселей, чтобы текст не прилипал к краям на телефонах */
        }

        /* === ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА === */
        .language-switch { /* Класс для контейнера с переключателем языка */
            position: absolute; /* Делаем элемент независимым от других, чтобы поставить его в конкретную точку экрана */
            top: 20px; /* Отступаем 20 пикселей от верхнего края экрана */
            right: 20px; /* Отступаем 20 пикселей от правого края экрана (как ты и просил - сверху справа) */
        }

        .lang-btn { /* Дизайн самой кнопки переключения языка */
            background: transparent; /* Убираем фон у кнопки (делаем прозрачным) */
            color: #888; /* Делаем текст серым (неактивным) */
            border: none; /* Убираем стандартную рамку кнопки */
            font-size: 16px; /* Задаем размер шрифта 16 пикселей */
            cursor: pointer; /* Делаем так, чтобы при наведении курсор менялся на "палец", показывая, что это кликабельно */
            font-weight: bold; /* Делаем текст жирным */
            transition: color 0.3s; /* Добавляем плавную анимацию изменения цвета длительностью 0.3 секунды */
        }

        .lang-btn.active { /* Дополнительный класс для ВЫБРАННОГО языка */
            color: #4CAF50; /* Если язык активен, красим его в приятный зеленый цвет */
        }

        .lang-btn:hover { /* Эффект ПРИ НАВЕДЕНИИ мышки на кнопку языка */
            color: #ffffff; /* При наведении текст светлеет до белого */
        }

        /* === ГЛАВНЫЙ КОНТЕЙНЕР С КОНТЕНТОМ === */
        .container { /* Главная карточка по центру экрана */
            margin-top: 80px; /* Отступаем сверху 80 пикселей, чтобы не налезать на кнопку переключения языка */
            max-width: 500px; /* Ограничиваем максимальную ширину карточки 500 пикселями (чтобы на ПК не растягивалось на весь экран) */
            width: 100%; /* Заставляем карточку занимать всю доступную ширину до 500 пикселей (важно для телефонов) */
            text-align: center; /* Центрируем весь текст внутри карточки */
            background-color: #1c1c1f; /* Делаем фон карточки чуть светлее, чем основной фон сайта, для выделения */
            padding: 40px; /* Делаем внутренние отступы со всех сторон по 40 пикселей */
            border-radius: 20px; /* Скругляем углы карточки на 20 пикселей */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); /* Добавляем мягкую черную тень для создания эффекта объема */
        }

        /* === ФОТОГРАФИЯ (АВАТАРКА) === */
        .profile-img { /* Настройки для твоей картинки */
            width: 150px; /* Задаем ширину картинки 150 пикселей */
            height: 150px; /* Задаем высоту картинки 150 пикселей (получится квадрат) */
            object-fit: cover; /* Заставляем картинку обрезаться так, чтобы она заполняла весь квадрат, не искажая пропорции */
            border-radius: 50%; /* Скругляем квадрат на 50% - превращаем картинку в идеальный круг */
            border: 4px solid #4CAF50; /* Добавляем зеленую рамку толщиной 4 пикселя вокруг фото */
            margin-bottom: 20px; /* Делаем отступ снизу в 20 пикселей до следующего элемента (заголовка) */
        }

        /* === ТЕКСТЫ === */
        h1 { /* Настройки для главного заголовка */
            font-size: 28px; /* Размер шрифта 28 пикселей */
            margin-bottom: 10px; /* Отступ снизу 10 пикселей */
            color: #ffffff; /* Цвет текста белый */
        }

        p { /* Настройки для обычного текста (описания) */
            font-size: 16px; /* Размер шрифта 16 пикселей */
            color: #b0b0b0; /* Цвет текста светло-серый (чтобы не резало глаза) */
            line-height: 1.5; /* Расстояние между строками текста (1.5 от размера шрифта) для читаемости */
            margin-bottom: 30px; /* Отступ снизу 30 пикселей до кнопок ссылок */
        }

        /* === КНОПКИ ССЫЛОК === */
        .links-container { /* Блок, внутри которого лежат все кнопки-ссылки */
            display: flex; /* Включаем Flexbox для кнопок */
            flex-direction: column; /* Выстраиваем кнопки в колонку (друг под другом) */
            gap: 15px; /* Задаем расстояние (дырку) между кнопками ровно 15 пикселей */
        }

        .link-btn { /* Дизайн самой кнопки со ссылкой */
            display: block; /* Делаем ссылку блочным элементом, чтобы она занимала всю ширину */
            width: 100%; /* Ширина кнопки 100% от родительского контейнера */
            padding: 15px; /* Внутренние отступы внутри кнопки (сверху и снизу, слева и справа) */
            background-color: #2a2a2e; /* Темно-серый цвет фона кнопки */
            color: #ffffff; /* Белый цвет текста на кнопке */
            text-decoration: none; /* Убираем стандартное подчеркивание у ссылки */
            border-radius: 10px; /* Скругляем углы кнопки на 10 пикселей */
            font-size: 16px; /* Размер текста в кнопке 16 пикселей */
            font-weight: 500; /* Делаем текст чуть жирнее (500 из 900) */
            transition: all 0.3s ease; /* Добавляем плавную анимацию для всех изменений (цвет, размер) длительностью 0.3с */
            border: 1px solid #3a3a40; /* Тонкая серая рамочка вокруг кнопки */
        }

        .link-btn:hover { /* Эффект ПРИ НАВЕДЕНИИ мышки на кнопку ссылки */
            background-color: #4CAF50; /* Меняем фон кнопки на зеленый при наведении */
            color: #ffffff; /* Текст остается белым */
            transform: translateY(-3px); /* Слегка приподнимаем кнопку вверх на 3 пикселя (эффект "всплытия") */
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4); /* Добавляем зеленую тень под кнопку */
            border-color: #4CAF50; /* Меняем цвет рамки тоже на зеленый */
        }

    </style>
</head>

<body> <!-- Открываем видимую часть сайта (то, что видит пользователь) -->

    <!-- БЛОК ПЕРЕКЛЮЧЕНИЯ ЯЗЫКА (СВЕРХУ СПРАВА) -->
    <div class="language-switch">
        <!-- Кнопка для русского языка. onclick="setLanguage('ru')" запускает функцию смены языка в JavaScript ниже -->
        <button class="lang-btn active" id="btn-ru" onclick="setLanguage('ru')">RU</button>
        <!-- Просто разделитель в виде вертикальной палочки -->
        <span style="color: #555;"> | </span>
        <!-- Кнопка для английского языка -->
        <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">EN</button>
    </div>

    <!-- ГЛАВНАЯ КАРТОЧКА САЙТА -->
    <div class="container">
        
        <!-- === АВАТАРКА / ФОТОГРАФИЯ === -->
        <!-- ИНСТРУКЦИЯ ПО ФОТО: 
             1. Положи свою фотографию (например, myphoto.jpg) в ту же папку, где лежит этот файл index.html
             2. В строчке ниже замени ссылку "https://via.placeholder.com/150" на название твоей фотографии "myphoto.jpg"
             3. Если пока фото нет, оставь как есть - будет серый кружок-заглушка.
        -->
        <img src="1.png" alt="Profile Picture" class="profile-img">

        <!-- ЗАГОЛОВОК (ИМЯ) -->
        <!-- id="title" нужен, чтобы JavaScript мог найти эту строчку и поменять текст при смене языка -->
        <h1 id="title">Hours of Birds</h1>

        <!-- ОПИСАНИЕ -->
        <!-- id="description" нужен для того же самого - смены текста скриптом -->
        <p id="description">Тут в будущем что-то будет. А пока вот ссылки на официальные страницы и сайты:</p>

        <!-- КОНТЕЙНЕР СО ССЫЛКАМИ -->
        <div class="links-container">
            
            <!-- ССЫЛКА НА YOUTUBE -->
            <!-- ИНСТРУКЦИЯ ПО ССЫЛКАМ: 
                 Вместо символа "#" внутри href="" вставь свою настоящую ссылку.
                 Например: href="https://youtube.com/@твойканал" 
                 target="_blank" означает, что ссылка откроется в новой вкладке, а не закроет твой сайт.
            -->
            <a href="https://youtube.com/@hoursofbirds" target="_blank" class="link-btn">YouTube</a>

            <!-- ССЫЛКА НА TELEGRAM -->
            <a href="https://t.me/HoursOfBirds" target="_blank" class="link-btn">Telegram</a>

            <!-- ССЫЛКА НА PIKABU -->
            <a href="https://pikabu.ru/@HoursOfBirds" target="_blank" class="link-btn">Pikabu</a>

            <!-- ССЫЛКА НА REDDIT -->
            <a href="https://www.reddit.com/u/HoursOfBirds" target="_blank" class="link-btn">Reddit</a>

        </div>
    </div>

    <script> /* Открываем тег скрипта. Здесь пишется JavaScript - логика работы сайта (в нашем случае - переводчик) */
        
        // Создаем "словарь". Это объект, который хранит тексты для разных языков.
        const translations = {
            ru: { // Блок с русскими текстами
                title: "Hours of Birds", // Главный заголовок на русском
                description: "Тут в будущем что-то будет. А пока вот ссылки на официальные страницы и сайты:" // Текст описания на русском
            },
            en: { // Блок с английскими текстами
                title: "Hours of Birds", // Главный заголовок на английском (я оставил так же, как бренд, но можешь поменять)
                description: "Something will be here in the future. For now, here are the links to official pages and sites:" // Текст описания на английском
            }
        };

        // Главная функция, которая срабатывает при нажатии на кнопки RU или EN
        // Переменная 'lang' принимает значение 'ru' или 'en'
        function setLanguage(lang) {
            
            // Находим на странице элемент с id="title" и меняем его текст на текст из нашего словаря выше
            document.getElementById('title').innerText = translations[lang].title;
            
            // Находим элемент с id="description" и меняем его текст на соответствующий языку
            document.getElementById('description').innerText = translations[lang].description;

            // --- БЛОК СМЕНЫ ЦВЕТА АКТИВНОЙ КНОПКИ ---
            
            // Сначала убираем класс 'active' (зеленый цвет) у кнопки русского языка
            document.getElementById('btn-ru').classList.remove('active');
            // Убираем класс 'active' у кнопки английского языка
            document.getElementById('btn-en').classList.remove('active');

            // Теперь добавляем класс 'active' только той кнопке, язык которой мы выбрали (lang)
            // 'btn-' + lang склеивается либо в 'btn-ru', либо в 'btn-en'
            document.getElementById('btn-' + lang).classList.add('active');
        }

    </script> <!-- Закрываем тег скрипта -->
</body> <!-- Закрываем видимую часть сайта -->
</html> <!-- Конец HTML документа -->
