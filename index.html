<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hours of Birds - Главная</title>

    <!-- Подключаем скрипт куки и аналитики -->
    <script src="analytics.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121214;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .language-switch {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .lang-btn {
            background: transparent;
            color: #888;
            border: none;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: color 0.3s;
        }
        .lang-btn.active { color: #4CAF50; }
        .lang-btn:hover { color: #ffffff; }

        .container {
            margin-top: 80px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            background-color: #1c1c1f;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .profile-img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #4CAF50;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #ffffff;
        }

        p {
            font-size: 16px;
            color: #b0b0b0;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .btn-play-red {
            display: block;
            width: 100%;
            padding: 18px;
            background-color: #e74c3c;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px; 
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
            transition: all 0.3s ease;
            border: 2px solid #c0392b;
        }
        .btn-play-red:hover {
            background-color: #c0392b;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(231, 76, 60, 0.6);
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #2a2a2e;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #3a3a40;
        }
        .link-btn:hover {
            background-color: #4CAF50;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
            border-color: #4CAF50;
        }
    </style>
</head>
<body>

    <div class="language-switch">
        <button class="lang-btn" id="btn-ru" onclick="setLanguage('ru')">RU</button>
        <span style="color: #555;"> | </span>
        <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">EN</button>
    </div>

    <div class="container">
        <img src="1.jpg" alt="Profile Picture" class="profile-img">

        <h1 id="title">Hours of Birds</h1>
        <p id="description">woW! Основной сайт всё ещё в разработке. Но вы уже можете поиграть в игру или посетить официальные соцсети проекта!</p>

        <div class="links-container">
            <a href="/games/bird_feeder/" class="btn-play-red" id="btn-game">
    🎮 Игра «Покорми Птиц!»
</a>

            <a href="https://youtube.com/@hoursofbirds" target="_blank" class="link-btn">YouTube</a>
            <a href="https://t.me/HoursOfBirds" target="_blank" class="link-btn">Telegram</a>
            <a href="https://pikabu.ru/@HoursOfBirds" target="_blank" class="link-btn">Pikabu</a>
            <a href="https://www.reddit.com/u/HoursOfBirds" target="_blank" class="link-btn">Reddit</a>
        </div>
    </div>

    <script>
        const translations = {
            ru: {
                title: "Hours of Birds",
                description: "Wow! Основной сайт всё ещё в разработке. Но вы уже можете поиграть в игру или посетить официальные соцсети проекта!",
                btn_game: "🎮 Игра «Покорми Птиц!»"
            },
            en: {
                title: "Hours of Birds",
                description: "Wow! The main website is still under development. But you can already play the game or visit the project's official social networks!",
                btn_game: "🎮 Play «Feed the Birds!»"
            }
        };

        // Читаем глобальный язык сайта из памяти при загрузке
        let savedLang = localStorage.getItem('siteLang');
        if (!savedLang) {
            savedLang = navigator.language.startsWith('ru') ? 'ru' : 'en';
        }

        function setLanguage(lang) {
            // СОХРАНЯЕМ ВЫБОР ДЛЯ ИГРЫ И ОСТАЛЬНОГО САЙТА
            localStorage.setItem('siteLang', lang);

            document.getElementById('title').innerText = translations[lang].title;
            document.getElementById('description').innerText = translations[lang].description;
            document.getElementById('btn-game').innerText = translations[lang].btn_game;

            document.getElementById('btn-ru').classList.remove('active');
            document.getElementById('btn-en').classList.remove('active');
            document.getElementById('btn-' + lang).classList.add('active');
        }

        // Запускаем при загрузке
        document.addEventListener('DOMContentLoaded', () => {
            setLanguage(savedLang);
        });
    </script>
</body>
</html>
