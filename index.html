<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com; img-src 'self' data: blob: https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Hours of Birds</title>
    <link rel="icon" href="1.jpg">
    <link rel="stylesheet" href="forest.css">
    <link rel="stylesheet" href="home-layout.css">
    <script src="analytics.js" defer></script>
    <script type="module" src="site.js"></script>
</head>
<body data-mode="normal" data-phase="idle">
    <div id="forest" aria-label="Ночной лес"></div>
    <div id="arcade-screen" hidden></div>
    <div class="corner-controls">
        <button id="toggle-panel" type="button" aria-expanded="true" aria-controls="main-panel" data-text="hide">Скрыть</button>
        <div class="mode-switch" role="group" aria-label="Режим сайта">
            <button type="button" data-mode="creative" aria-pressed="false" data-text="creative">Творческий</button>
            <button type="button" data-mode="normal" aria-pressed="true" data-text="normal">Обычный</button>
        </div>
    </div>
    <div class="language-switch" role="group" aria-label="Язык">
        <button type="button" data-site-language="ru" aria-pressed="true">RU</button>
        <button type="button" data-site-language="en" aria-pressed="false">EN</button>
    </div>
    <header class="site-header" id="main-panel">
        <a class="brand" href="./"><img src="1.jpg" alt=""><h1>Hours of Birds</h1></a>
        <p class="description" data-text="description"></p>
        <nav class="primary-nav" aria-label="Главное меню">
            <a class="play-link" id="btn-game" href="games/bird_feeder/" data-text="play">Играть</a>
            <a href="https://youtube.com/@hoursofbirds" target="_blank" rel="noopener noreferrer">YouTube</a>
            <a href="https://t.me/HoursOfBirds" target="_blank" rel="noopener noreferrer">Telegram</a>
            <a href="https://pikabu.ru/@HoursOfBirds" target="_blank" rel="noopener noreferrer">Pikabu</a>
            <a href="https://www.reddit.com/u/HoursOfBirds" target="_blank" rel="noopener noreferrer">Reddit</a>
        </nav>
        <div class="home-audio">
            <button type="button" id="music-toggle" aria-pressed="true"></button>
            <button type="button" id="sounds-toggle" aria-pressed="true"></button>
            <button type="button" id="volume-open" data-text="volume">Громкость</button>
        </div>
    </header>
    <dialog id="volume-dialog" aria-labelledby="volume-title">
        <h2 id="volume-title" data-text="volumeTitle">Настройка громкости</h2>
        <label><span data-text="music">Музыка</span><input id="music-volume" type="range" min="0" max="100" value="13"><output for="music-volume">13%</output></label>
        <label><span data-text="sounds">Звуки</span><input id="sounds-volume" type="range" min="0" max="100" value="33"><output for="sounds-volume">33%</output></label>
        <button type="button" id="volume-close" data-text="close">Закрыть</button>
    </dialog>
    <div class="scene-status" id="scene-status" role="status" hidden>
        <span id="status-text">Загрузка леса…</span>
        <progress id="scene-progress" max="4" value="0" aria-label="Загрузка леса"></progress>
        <button type="button" id="retry-scene" hidden data-text="retry">Повторить</button>
    </div>
    <button class="return-button" id="return-forest" type="button" hidden data-text="cancel">Отмена</button>
    <noscript><div class="fallback"><p>Для 3D-сцены нужен JavaScript.</p><a class="play-link" href="games/bird_feeder/">Покорми птиц</a></div></noscript>
</body>
</html>
